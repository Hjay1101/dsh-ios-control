<!doctype html>
<!-- dsh-ios-control · mobile PWA (M1): 任务遥控器。
     M0：工作区分组任务列表 / 五态状态点 / WS 实时 / 下拉刷新
     M1：会话详情（纯文本流）/ 发送消息 / “需要我”一键回答（审批·提问·计划评审）/ 深链
     零依赖单文件；契约见 docs/MOBILE-PRODUCT.md（全部经隔离实例实测定案）。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DSH">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>DeepSeek Harness</title>
<style>
  :root{
    --bg:#0b0d10; --card:#15181d; --line:#232830; --txt:#e8eaed; --dim:#8b929c;
    --run:#34c759; --appr:#ff9f0a; --ques:#bf5af2; --plan:#64d2ff; --idle:#5a616b;
    --accent:#0a84ff; --danger:#ff453a;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f2f2f7; --card:#fff; --line:#e3e3e8; --txt:#1c1c1e; --dim:#6e6e73;
      --run:#30d158; --appr:#ff9500; --ques:#af52de; --plan:#32ade6; --idle:#aeaeb2; }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif;
    font-size:16px; padding-bottom:env(safe-area-inset-bottom);
    -webkit-user-select:none; user-select:none;
  }
  header{
    padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;
    display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  }
  header h1{font-size:19px; font-weight:700; margin:0; white-space:nowrap}
  #host{font-size:11px; color:var(--dim); text-align:right; line-height:1.35; max-width:52%}
  #host .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--idle);margin-right:4px;vertical-align:1px}
  #host .dot.on{background:var(--run)}
  nav{
    display:flex; gap:8px; padding:4px 16px 10px; position:sticky; top:0;
    background:var(--bg); z-index:5;
  }
  .chip{
    border:1px solid var(--line); background:var(--card); color:var(--dim);
    border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer;
  }
  .chip.on{color:var(--txt); border-color:var(--accent)}
  .chip b{font-weight:600; margin-left:4px}
  #plus{
    margin-left:auto; width:34px; height:34px; border-radius:50%;
    border:1px solid var(--accent); background:var(--card); color:var(--accent);
    font-size:20px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  #banner{
    display:none; margin:0 16px 8px; padding:8px 12px; border-radius:10px;
    font-size:13px; background:rgba(255,159,10,.14); color:var(--appr);
  }
  #banner.show{display:block}
  main{padding:0 16px calc(env(safe-area-inset-bottom) + 40px)}
  .group{margin:14px 0 4px; font-size:13px; font-weight:600; color:var(--dim);
    display:flex; justify-content:space-between; padding:4px 2px}
  .group.tap{cursor:pointer}
  .group .g-badges span{margin-left:8px; font-weight:500}
  .g-count{color:var(--dim); opacity:.7}
  .row{
    display:flex; align-items:center; gap:11px;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; margin:7px 0; min-height:52px;
  }
  .row.tap{cursor:pointer}
  .row .st{flex:0 0 auto; width:11px; height:11px; border-radius:50%; background:var(--idle)}
  .row.running .st{background:var(--run)}
  .row.approval .st,.row.question .st,.row.plan-review .st{animation:pulse 1.6s ease-in-out infinite}
  .row.approval .st{background:var(--appr)} .row.question .st{background:var(--ques)} .row.plan-review .st{background:var(--plan)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .row .meta{flex:1; min-width:0}
  .row .title{font-size:15px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row .sub{display:block;font-size:12px; color:var(--dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row .flag{flex:0 0 auto; font-size:11px; font-weight:600; border-radius:6px; padding:3px 7px}
  .flag.approval{color:var(--appr); background:rgba(255,159,10,.15)}
  .flag.question{color:var(--ques); background:rgba(191,90,242,.15)}
  .flag.plan-review{color:var(--plan); background:rgba(100,210,255,.15)}
  /* 待处理卡片（“需要我”过滤下的可操作行） */
  .row.card{flex-wrap:wrap; gap:8px}
  .row.card .meta{flex:1 1 100%}
  .row.card .summary{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
    font-size:13px; color:var(--txt); opacity:.85; margin-top:6px; white-space:normal; line-height:1.45}
  .acts{display:flex; gap:8px; width:100%}
  .btn{
    flex:1; border:none; border-radius:9px; padding:11px 0; font-size:14px; font-weight:600;
    background:var(--line); color:var(--txt); cursor:pointer;
  }
  .btn.primary{background:var(--accent); color:#fff}
  .btn.danger{background:rgba(255,69,58,.16); color:var(--danger)}
  .btn.ok{background:rgba(52,199,89,.18); color:var(--run)}
  .btn:disabled{opacity:.45}
  .empty{text-align:center; color:var(--dim); font-size:14px; padding:48px 0}
  #pull{
    position:fixed; top:calc(env(safe-area-inset-top) + 6px); left:0; right:0;
    text-align:center; font-size:12px; color:var(--dim);
    transform:translateY(-32px); transition:transform .18s; pointer-events:none;
  }
  #pull.armed{transform:translateY(0)}

  /* ---------- 会话详情（推入式全屏） ----------
   * touch-action 声明手势归属：覆盖层自身不滚、只有 stream 纵向滚，
   * 否则 iOS 会把首触判给底层文档（表现为“进去滚不动，过一会才行”）。 */
  #detail{
    position:fixed; inset:0; background:var(--bg); z-index:20;
    display:none; flex-direction:column; padding-top:env(safe-area-inset-top);
    touch-action:none;
  }
  #detail.open{display:flex}
  #detail header{
    padding:12px 16px 10px; border-bottom:1px solid var(--line);
    align-items:center;
  }
  #detail header h1{font-size:17px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #back{
    border:none; background:none; color:var(--accent); font-size:15px; padding:6px 10px 6px 0;
    cursor:pointer; font-weight:500;
  }
  /* 详情副栏：左 turn 状态（Deep diving... 计时），右当前模型（点击切换） */
  #subbar{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:7px 16px; border-bottom:1px solid var(--line); font-size:12px;
  }
  #turnstatus{color:var(--run); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #turnstatus:empty::before{content:''}
  #modelrow{
    border:none; background:var(--card); color:var(--dim); font-size:12px;
    border-radius:999px; padding:5px 11px; cursor:pointer; max-width:52%;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  /* 模型选择底部面板 */
  #sheetmask{position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.45)}
  #modelsheet{
    position:absolute; left:0; right:0; bottom:0;
    background:var(--card); border-radius:16px 16px 0 0;
    padding:14px 16px calc(env(safe-area-inset-bottom) + 18px);
    max-height:70vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  #modelsheet h3{margin:4px 0 8px; font-size:13px; color:var(--dim); font-weight:600}
  .mrow{
    display:block; width:100%; text-align:left; margin:6px 0; padding:10px 12px;
    border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--txt);
    font-size:14px; cursor:pointer;
  }
  .mrow small{display:block; color:var(--dim); font-size:11px; margin-top:2px}
  .mrow.cur{border-color:var(--accent)}
  #stream{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:12px 16px 8px; touch-action:pan-y; overscroll-behavior:contain;
    -webkit-user-select:text; user-select:text}
  .msg{margin:9px 0; font-size:14px; line-height:1.55}
  .msg.user{
    background:rgba(10,132,255,.22); border-radius:14px 14px 4px 14px;
    padding:9px 12px; margin-left:44px; white-space:pre-wrap; word-break:break-word;
  }
  .msg.assistant{white-space:pre-wrap; word-break:break-word; color:var(--txt)}
  /* 思维链：弱化灰字 + 左侧细线，与正文区分 */
  .msg.thinking{
    font-size:12px; line-height:1.5; color:var(--dim); opacity:.85;
    white-space:pre-wrap; word-break:break-word;
    border-left:2px solid var(--line); padding-left:9px; margin:10px 0;
  }
  .msg.tool{font-size:12px; color:var(--dim); padding-left:6px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  /* 流式直播区（实时思维链 + 回复中），正式消息落地后清空 */
  #live{display:none}
  #live.on{display:block}
  /* 思维链折叠组件：一行持续滚动显示最新内容，点击展开全文（对齐桌面端交互） */
  .msg.thinking{font-size:12px; color:var(--dim);
    border-left:2px solid var(--line); padding-left:9px; margin:10px 0}
  .th-head{display:block; cursor:pointer; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; line-height:1.5; -webkit-user-select:none; user-select:none}
  .th-full{white-space:pre-wrap; word-break:break-word; line-height:1.55;
    margin-top:6px; opacity:.9; -webkit-user-select:text; user-select:text}
  .collapsed .th-full{display:none}
  #more{display:block; margin:10px auto; border:none; background:var(--card); color:var(--accent);
    border-radius:999px; padding:7px 16px; font-size:12px}
  /* 待处理问题卡（详情页顶部） */
  #askcard{
    margin:10px 16px 0; padding:12px 14px; border-radius:12px;
    background:rgba(191,90,242,.08); border:1px solid rgba(191,90,242,.35);
    font-size:13px;
  }
  #askcard .q{font-weight:600; margin:8px 0 6px}
  #askcard .opt{
    display:block; width:100%; text-align:left; margin:5px 0; padding:9px 11px;
    border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--txt);
    font-size:13px; cursor:pointer;
  }
  /* 底部输入栏 */
  #composer{
    display:flex; gap:8px; padding:8px 12px calc(env(safe-area-inset-bottom) + 10px);
    border-top:1px solid var(--line); background:var(--bg);
  }
  #input{
    flex:1; border:1px solid var(--line); background:var(--card); color:var(--txt);
    border-radius:18px; padding:8px 14px; font-size:16px; outline:none;
    -webkit-user-select:text; user-select:text;
  }
  #send{border:none; background:var(--accent); color:#fff; border-radius:50%;
    width:40px; height:40px; font-size:18px; cursor:pointer; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; padding:0; line-height:1}
</style>
</head>
<body>
<div id="pull">↓ 松开刷新</div>

<!-- 主列表视图 -->
<header>
  <h1>DeepSeek Harness</h1>
  <div id="host"><span class="dot"></span>连接中…</div>
</header>
<nav>
  <button class="chip on" data-f="all">全部<b></b></button>
  <button class="chip" data-f="running">运行中<b></b></button>
  <button class="chip" data-f="attention">需要我<b></b></button>
  <button id="plus" title="新任务">＋</button>
</nav>
<div id="banner"></div>
<main id="list"><div class="empty">加载中…</div></main>

<!-- 会话详情视图 -->
<div id="detail">
  <header><button id="back">‹ 列表</button><h1 id="dtitle"></h1></header>
  <div id="subbar">
    <span id="turnstatus"></span>
    <button id="modelrow" type="button"></button>
  </div>
  <div id="askcard" style="display:none"></div>
  <div id="stream"><div class="empty">加载中…</div><div id="live"></div></div>
  <div id="composer">
    <input id="input" type="text" placeholder="发消息给这个任务…" autocomplete="off">
    <button id="send">↑</button>
  </div>
</div>

<!-- 模型选择底部面板 -->
<div id="sheetmask" style="display:none"><div id="modelsheet"></div></div>

<script>
'use strict'
/* ---------- utils ---------- */
const $ = (sel) => document.querySelector(sel)
const uuid = () => {
  const b = crypto.getRandomValues(new Uint8Array(16))
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80
  const h = [...b].map((x) => x.toString(16).padStart(2, '0')).join('')
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`
}
const ago = (ts) => {
  const s = Math.max(0, (Date.now() - ts) / 1000)
  if (s < 60) return '刚刚'
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前'
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前'
  return Math.floor(s / 86400) + ' 天前'
}

/* ---------- RPC ----------
 * 点号形式 POST /api/<namespace.method>（斜杠形式实测 404）；信封同官方客户端。
 * 自带 uuid 实现（LAN 明文 HTTP 无 secure context）。 */
async function rpc(method, payload) {
  const rpcId = uuid()
  let res
  try {
    res = await fetch('/api/' + method, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ type: 'client-request', rpcId, method, payload }),
    })
  } catch { throw new Error('network') }
  if (res.status === 401) throw new Error('unauthorized')
  if (!res.ok) throw new Error('HTTP ' + res.status)
  const full = await res.json()
  if (full.rpcId !== rpcId) throw new Error('rpcId mismatch')
  return full.result // {ok:true,value} | {ok:false,error}
}

/* 回答 answerable server-request 帧：POST /api/respond 回显 rpcId。
 * approval value: {sessionId, approvalId, outcome:'allowed-once'|'rejected'}
 * question value: {sessionId, answer:{answers:[{id, selected:[], custom?}]}} */
async function respond(rpcId, value) {
  let res
  try {
    res = await fetch('/api/respond', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ type: 'client-response', rpcId, result: { ok: true, value } }),
    })
  } catch { throw new Error('network') }
  if (!res.ok) throw new Error('HTTP ' + res.status)
  return res.json() // RpcReceipt {accepted, reason?}
}

/* ---------- state ---------- */
const state = {
  workspaces: [],
  archived: new Set(),
  sessions: new Map(),       // sessionId → summary
  pending: new Map(),        // key → {sessionId, kind, rpcId, frame}
  filter: 'all',
  loadedOnce: false,
  detail: null,              // 打开的会话 id
  dTitle: '',
  dBaseSeq: null,
  dHasMore: false,
  // 收起的工作区分组（localStorage 持久化，'_other' 为“其他”桶）
  collapsed: new Set((() => { try { return JSON.parse(localStorage.getItem('dsh-collapsed') ?? '[]') } catch { return [] } })()),
}
function saveCollapsed() {
  try { localStorage.setItem('dsh-collapsed', JSON.stringify([...state.collapsed])) } catch { /* private mode */ }
}
const TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone } catch { return undefined } })()

function pendingBySession() {
  const m = new Map()
  const rank = { approval: 0, 'plan-review': 1, question: 2 }
  for (const p of state.pending.values()) {
    if (!p.sessionId) continue
    const prev = m.get(p.sessionId)
    if (prev === undefined || rank[p.kind] < rank[prev]) m.set(p.sessionId, p.kind)
  }
  return m
}

/* ---------- data refresh ---------- */
let syncing = false
async function resync() {
  if (syncing) return
  syncing = true
  try {
    const [ws, ss] = await Promise.all([rpc('workspace.list', {}), rpc('session.list', {})])
    if (!ws.ok) throw new Error(ws.error?.code ?? 'workspace.list failed')
    if (!ss.ok) throw new Error(ss.error?.code ?? 'session.list failed')
    state.workspaces = ws.value.items ?? []
    state.archived = new Set(ws.value.archivedSessionIds ?? [])
    state.sessions.clear()
    for (const s of ss.value.items ?? []) state.sessions.set(s.sessionId, s)
    state.loadedOnce = true
    setBanner('')
    render()
  } catch (err) {
    if (err.message === 'unauthorized') {
      setBanner('登录已过期 —— 请在桌面端聊天框说「给我配对码」重新扫码')
    } else {
      setBanner('同步失败（' + err.message + '），下拉重试')
    }
    render()
  } finally { syncing = false }
}

async function loadHostInfo() {
  try {
    const r = await rpc('host.describe', {})
    const el = $('#host')
    if (r.ok && r.value) {
      // 电脑在线：主人名取 home 路径尾段（host.describe 无 hostname 字段）
      const owner = String(r.value.home ?? '').split('/').filter(Boolean).pop() ?? 'DSH'
      el.innerHTML = '<span class="dot on"></span>' + esc(owner) + ' 的电脑 · 在线'
    } else { el.innerHTML = '<span class="dot"></span>电脑离线' }
  } catch { $('#host').innerHTML = '<span class="dot"></span>电脑离线' }
}

/* ---------- WebSocket downlinks ----------
 * 宿主无 SSE 变体（实测 426）；WS 反代 + 网关 keepalive ping 覆盖手机腿。
 * host 流 onopen 全量 resync；mux 流 onopen 清空 pending、由重放重建。 */
function connectWs(path, onOpen, onFrame) {
  let backoff = 1000, closed = false
  function connect() {
    if (closed) return
    let ws
    try {
      ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + path)
    } catch { retry(); return }
    ws.onopen = () => { backoff = 1000; onOpen() }
    ws.onmessage = (ev) => { try { onFrame(JSON.parse(ev.data)) } catch { /* skip bad frame */ } }
    ws.onclose = () => { if (!closed) retry() }
    ws.onerror = () => { try { ws.close() } catch { /* already closing */ } }
  }
  function retry() { setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 30_000) }
  connect()
}

function openHostStream() {
  connectWs('/api/events.host',
    () => { resync(); loadHostInfo() },
    (raw) => {
      const f = raw?.payload ?? raw
      if (!f || typeof f.type !== 'string') return
      if (f.type === 'host/session-status' && f.sessionId) {
        const s = state.sessions.get(f.sessionId)
        if (s) { s.running = Boolean(f.running); render() }
      } else if (String(f.type).startsWith('host/')) {
        resync()
      }
    })
}

function openMuxStream() {
  connectWs('/api/events.mux',
    () => { state.pending.clear(); render(); syncPendingToDetail() },
    (raw) => {
      const f = raw?.payload ?? raw
      if (!f || typeof f.type !== 'string') return
      // 帧形状（权威 schema）：approval/requested {sessionId,approvalId,toolName,reason?}；
      // question/requested {sessionId, questions:[{id,question,options?,intent?}]}；
      // plan-review = question 的 intent.kind==='plan-review'（非 approval 帧）。
      if (f.type === 'approval/requested') {
        state.pending.set('a:' + f.approvalId, {
          sessionId: f.sessionId, kind: 'approval', rpcId: raw.rpcId, frame: f,
        })
        render()
      } else if (f.type === 'question/requested') {
        const isPlan = (f.questions ?? []).some((q) => q.intent?.kind === 'plan-review')
        state.pending.set('q:' + raw.rpcId, {
          sessionId: f.sessionId, kind: isPlan ? 'plan-review' : 'question',
          rpcId: raw.rpcId, frame: f,
        })
        render()
      } else if (f.type === 'approval/resolved') {
        state.pending.delete('a:' + f.approvalId)
        render()
      } else if (f.type === 'question/resolved') {
        state.pending.delete('q:' + f.questionRpcId)
        render()
      } else if (f.type === 'session/title') {
        const s = state.sessions.get(f.sessionId)
        if (s && f.title) {
          s.projections = s.projections ?? {}
          s.projections.values = s.projections.values ?? {}
          s.projections.values.title = f.title
          if (state.detail === f.sessionId) $('#dtitle').textContent = f.title
          render()
        }
      } else if (f.type === 'session/event') {
        onDetailEvent(f)
      }
    })
}

/* ---------- derive & render（主列表） ---------- */
function rowKindOf(s, pendMap) {
  const p = pendMap.get(s.sessionId)
  if (p) return p
  return s.running ? 'running' : 'idle'
}
function isVisible(s, pendMap) {
  if (s.blank && !s.running && !pendMap.has(s.sessionId)) return false
  if (state.archived.has(s.sessionId)) return false
  return true
}

function render() {
  const list = $('#list')
  if (!state.loadedOnce) { list.innerHTML = '<div class="empty">加载中…</div>'; updateChips(); return }
  const pendMap = pendingBySession()

  const owned = new Set()
  for (const w of state.workspaces) for (const id of w.sessionIds ?? []) owned.add(id)

  const groups = []
  for (const w of state.workspaces) {
    const rows = []
    for (const id of w.sessionIds ?? []) {
      const s = state.sessions.get(id)
      if (!s || !isVisible(s, pendMap)) continue
      rows.push(s)
    }
    groups.push({ id: w.workspaceId, title: w.title || w.path, rows })
  }
  const loose = [...state.sessions.values()].filter((s) => !owned.has(s.sessionId) && isVisible(s, pendMap))
  if (loose.length > 0) groups.push({ id: '_other', title: '其他', rows: loose })

  const order = { approval: 0, 'plan-review': 1, question: 2, running: 3, idle: 4 }
  for (const g of groups) {
    g.rows.sort((a, b) =>
      (order[rowKindOf(a, pendMap)] - order[rowKindOf(b, pendMap)]) || ((b.updatedAt ?? 0) - (a.updatedAt ?? 0)))
  }

  let shown = 0, runCount = 0, attCount = 0
  const html = []
  for (const g of groups) {
    const filtered = g.rows.filter((s) => {
      const k = rowKindOf(s, pendMap)
      if (k === 'running') runCount++
      if (k !== 'running' && k !== 'idle') attCount++
      if (state.filter === 'running') return k === 'running'
      if (state.filter === 'attention') return k !== 'running' && k !== 'idle'
      return true
    })
    if (filtered.length === 0) continue
    const gRun = filtered.filter((s) => rowKindOf(s, pendMap) === 'running').length
    const gAtt = filtered.filter((s) => { const k = rowKindOf(s, pendMap); return k !== 'running' && k !== 'idle' }).length
    const collapsed = state.collapsed.has(g.id)
    html.push('<div class="group tap" data-g="' + esc(g.id) + '">' +
      '<span>' + (collapsed ? '▸ ' : '▾ ') + esc(g.title) + '</span><span class="g-badges">' +
      (gRun ? '<span style="color:var(--run)">运行 ' + gRun + '</span>' : '') +
      (gAtt ? '<span style="color:var(--appr)">待处理 ' + gAtt + '</span>' : '') +
      '<span class="g-count">' + filtered.length + '</span></span></div>')
    if (collapsed) { shown += filtered.length; continue }
    for (const s of filtered) {
      const k = rowKindOf(s, pendMap)
      shown++
      const label = { approval: '待审批', question: '提问', 'plan-review': '计划评审' }[k]
      const sub = [s.parentSessionId ? '↳ 子任务' : null, ago(s.updatedAt ?? Date.now())].filter(Boolean).join(' · ')
      const card = k !== 'running' && k !== 'idle'
      html.push('<div class="row tap ' + k + (card ? ' card' : '') + '" data-sid="' + esc(s.sessionId) + '">' +
        '<span class="st"></span>' +
        '<span class="meta"><span class="title">' + esc(displayTitle(s)) + '</span>' +
        '<span class="sub">' + esc(sub) + '</span>' +
        (card ? '<span class="summary">' + esc(pendingSummary(s.sessionId, k)) + '</span>' : '') +
        '</span>' +
        (label ? '<span class="flag ' + k + '">' + label + '</span>' : '') +
        (card ? actionsHtml(s.sessionId, k) : '') +
        '</div>')
    }
  }
  list.innerHTML = shown === 0
    ? '<div class="empty">' + (state.filter === 'all' ? '没有进行中的任务' : '该筛选下暂无任务') + '</div>'
    : html.join('')
  updateChips(runCount, attCount)
}

function pendingSummary(sessionId, kind) {
  for (const p of state.pending.values()) {
    if (p.sessionId !== sessionId || p.kind !== kind) continue
    if (p.frame?.type === 'approval/requested') {
      return p.frame.reason || ('请求使用工具：' + (p.frame.toolName ?? '未知'))
    }
    if (p.frame?.type === 'question/requested') {
      return (p.frame.questions ?? []).map((q) => q.question).join(' / ')
    }
  }
  return ''
}
// plan-review 批准/拒绝选项名（intent.approve 为批准标签，其余选项皆拒绝）
function planOptions(p) {
  const q0 = (p.frame.questions ?? [])[0] ?? {}
  const approveLabel = q0.intent?.approve
  const declineLabel = (q0.options ?? []).map((o) => o.label).find((l) => l !== approveLabel)
  return { q0, approveLabel, declineLabel }
}
function actionsHtml(sessionId, kind) {
  for (const [key, p] of state.pending.entries()) {
    if (p.sessionId !== sessionId || p.kind !== kind) continue
    if (kind === 'approval') {
      return '<div class="acts" data-key="' + esc(key) + '">' +
        '<button class="btn ok" data-act="allow">允许一次</button>' +
        '<button class="btn danger" data-act="reject">拒绝</button></div>'
    }
    if (kind === 'plan-review') {
      const { declineLabel } = planOptions(p)
      return '<div class="acts" data-key="' + esc(key) + '">' +
        '<button class="btn primary" data-act="approve-plan">批准计划</button>' +
        '<button class="btn danger" data-act="decline-plan"' + (declineLabel ? '' : ' disabled') + '>拒绝</button></div>'
    }
    return '' // 普通 question：点击行进详情页作答
  }
  return ''
}

function displayTitle(s) {
  const t = s.projections?.values?.title ?? s.title
  if (t) return t
  if (s.cwd) return String(s.cwd).split('/').filter(Boolean).pop() || '未命名任务'
  return '未命名任务'
}
function updateChips(runCount, attCount) {
  document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c.dataset.f === state.filter))
  document.querySelector('.chip[data-f=all] b').textContent = ''
  document.querySelector('.chip[data-f=running] b').textContent = runCount ?? countBy('running')
  document.querySelector('.chip[data-f=attention] b').textContent = attCount ?? countBy('attention')
}
function countBy(kind) {
  const pendMap = pendingBySession()
  let n = 0
  for (const s of state.sessions.values()) {
    if (!isVisible(s, pendMap)) continue
    const k = rowKindOf(s, pendMap)
    if (kind === 'running' && k === 'running') n++
    if (kind === 'attention' && k !== 'running' && k !== 'idle') n++
  }
  return n
}
function esc(t) {
  return String(t).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[ch]))
}
function setBanner(text) {
  const b = $('#banner')
  b.textContent = text
  b.classList.toggle('show', text !== '')
}

/* ---------- 一键回答 ---------- */
async function answer(key, action) {
  const p = state.pending.get(key)
  if (!p) return
  const sid = p.frame.sessionId
  try {
    if (action === 'allow' || action === 'reject') {
      await respond(p.rpcId, { sessionId: sid, approvalId: p.frame.approvalId,
        outcome: action === 'allow' ? 'allowed-once' : 'rejected' })
    } else if (action === 'approve-plan' || action === 'decline-plan') {
      const { q0, approveLabel, declineLabel } = planOptions(p)
      const label = action === 'approve-plan' ? approveLabel : declineLabel
      if (!label) return
      await respond(p.rpcId, { sessionId: sid,
        answer: { answers: [{ id: q0.id, selected: [label] }] } })
    }
    state.pending.delete(key)
    render()
  } catch (err) {
    setBanner('回答失败（' + err.message + '）——可能已过时，下拉刷新')
  }
}

/* ---------- 会话详情 ---------- */
// 详情缓存：渲染后的 HTML + 分页锚点，重进会话秒开（不再重复拉 500KB+ 历史）
state.hist = new Map() // sessionId → {html, hasMore, baseSeq, ts}
const HIST_TTL_MS = 30 * 60_000
const HIST_MAX = 40
function histGet(sid) {
  const h = state.hist.get(sid)
  if (h && Date.now() - h.ts > HIST_TTL_MS) { state.hist.delete(sid); return null }
  return h
}
function histPut(sid, h) {
  state.hist.set(sid, h)
  if (state.hist.size > HIST_MAX) state.hist.delete(state.hist.keys().next().value)
}

async function openDetail(sid) {
  state.detail = sid
  const s = state.sessions.get(sid)
  state.dTitle = s ? displayTitle(s) : '会话'
  state.dBaseSeq = null
  state.dHasMore = false
  $('#dtitle').textContent = state.dTitle
  $('#detail').classList.add('open')
  clearLive()
  clearTurn()
  $('#input').value = ''
  renderAskCard()
  loadModels(sid)
  const cached = histGet(sid)
  if (cached) {
    // 秒开：先渲染缓存，同时后台静默刷新拿最新
    state.dHasMore = cached.hasMore
    state.dBaseSeq = cached.baseSeq
    $('#stream').innerHTML = cached.html || '<div class="empty">还没有消息</div>'
    $('#stream').insertAdjacentHTML('beforeend', '<div id="live"></div>')
    renderLive(false)
    renderMoreButton()
    loadHistory(false) // fire-and-forget 刷新
  } else {
    $('#stream').innerHTML = '<div class="empty">加载中…</div><div id="live"></div>'
    await loadHistory(false)
  }
  $('#stream').scrollTop = $('#stream').scrollHeight
}
function closeDetail() {
  state.detail = null
  clearTurn()
  closeSheet()
  $('#detail').classList.remove('open')
}

/* ---------- turn 状态行（对齐桌面端 "Deep diving... 计时"） ----------
 * 锚点 = 最后一个 turn/start 的 event.time；turn/end 清除。
 * 与桌面一致：运行满 15s 才显示时长。 */
state.turnStart = null
function fmtDur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000))
  const m = Math.floor(s / 60), h = Math.floor(m / 60)
  if (h > 0) return h + '小时' + (m % 60) + '分'
  if (m > 0) return m + '分' + (s % 60) + '秒'
  return s + '秒'
}
function renderTurn() {
  const el = $('#turnstatus')
  if (state.detail === null || state.turnStart === null) { el.textContent = ''; return }
  const elapsed = Date.now() - state.turnStart
  el.textContent = elapsed >= 15_000 ? 'Deep diving... ' + fmtDur(elapsed) : 'Deep diving...'
}
function computeTurnFromEvents(events) {
  // 尾部扫描：最后一条 turn/start 之后是否还有 turn/end
  let start = null, open = false
  for (const entry of events) {
    const ev = entry.event ?? entry
    if (ev.type === 'turn/start') { start = ev.time ?? null; open = true }
    else if (ev.type === 'turn/end') { open = false }
  }
  state.turnStart = open ? start : null
  renderTurn()
}
function clearTurn() { state.turnStart = null; renderTurn() }
setInterval(() => { if (state.detail !== null && state.turnStart !== null) renderTurn() }, 1000)

/* ---------- 模型查看与切换（session.models / session.selectModel） ---------- */
state.models = null
async function loadModels(sid) {
  if (!sid) return
  try {
    const r = await rpc('session.models', { sessionId: sid })
    if (!r.ok || state.detail !== sid) return
    state.models = r.value
    renderModelRow()
  } catch { /* 模型目录失败不阻塞详情页 */ }
}
function renderModelRow() {
  const el = $('#modelrow')
  const cur = state.models?.current
  el.textContent = cur ? (cur.provider + '/' + cur.model) : '模型'
}
async function selectModel(provider, model) {
  const sid = state.detail
  if (!sid) return
  try {
    const r = await rpc('session.selectModel', { sessionId: sid, provider, model })
    if (!r.ok) { setBanner('切换失败：' + (r.error?.message ?? '?')); return }
    state.models = { ...(state.models ?? {}), current: r.value.selected }
    renderModelRow()
    closeSheet()
  } catch (err) { setBanner('切换失败（' + err.message + '）') }
}
function closeSheet() { $('#sheetmask').style.display = 'none'; $('#modelsheet').innerHTML = '' }
function openSheet() {
  const m = state.models
  if (!m || !Array.isArray(m.groups)) return
  const cur = m.current
  let html = '<h3>选择模型</h3>'
  for (const g of m.groups) {
    html += '<h3>' + esc(g.name) + '</h3>'
    for (const mod of g.models ?? []) {
      const isCur = cur && cur.provider === g.id && cur.model === mod.id
      html += '<button class="mrow' + (isCur ? ' cur' : '') + '" data-p="' + esc(g.id) + '" data-m="' + esc(mod.id) + '">' +
        esc(mod.name) + (isCur ? ' ✓' : '') +
        '<small>' + esc(mod.id) + '</small></button>'
    }
  }
  $('#modelsheet').innerHTML = html
  $('#sheetmask').style.display = 'block'
  $('#modelsheet').querySelectorAll('.mrow').forEach((el) => {
    el.addEventListener('click', () => selectModel(el.dataset.p, el.dataset.m))
  })
}

async function loadHistory(older) {
  const sid = state.detail
  if (!sid) return
  try {
    const payload = older
      ? { sessionId: sid, maxMessages: 30, beforeSeq: state.dBaseSeq }
      : { sessionId: sid, maxMessages: 30 }
    const r = await rpc('session.history', payload)
    if (!sid || state.detail !== sid) return
    if (!r.ok) { $('#stream').innerHTML = '<div class="empty">加载失败：' + esc(r.error?.message ?? '?') + '</div>'; return }
    const { events, hasMore } = r.value
    state.dHasMore = Boolean(hasMore)
    if (events.length > 0) state.dBaseSeq = events[0].event.seq
    const html = events.map(eventToHtml).filter(Boolean)
    if (older) {
      const anchor = $('#stream').firstElementChild
      $('#stream').insertAdjacentHTML('afterbegin', html.join(''))
      anchor?.scrollIntoView()
      // 分页加载追加到缓存前面，保持锚点完整
      const prev = state.hist.get(sid)
      if (prev) { prev.html = html.join('') + prev.html; prev.baseSeq = state.dBaseSeq; prev.ts = Date.now() }
    } else {
      $('#stream').innerHTML = html.length > 0 ? html.join('') : '<div class="empty">还没有消息</div>'
      // innerHTML rewrite drops the live node; rebuild it and restore any
      // in-flight stream buffer.
      $('#stream').insertAdjacentHTML('beforeend', '<div id="live"></div>')
      renderLive(false)
      histPut(sid, { html: html.length > 0 ? html.join('') : '', hasMore: state.dHasMore, baseSeq: state.dBaseSeq, ts: Date.now() })
    }
    computeTurnFromEvents(events)
    renderMoreButton()
  } catch (err) {
    // 后台刷新失败时保留已显示的缓存内容，不冲掉已有画面
    if (!histGet(sid)) $('#stream').innerHTML = '<div class="empty">加载失败（' + esc(err.message) + '）</div>'
  }
}
function renderMoreButton() {
  $('#more')?.remove()
  if (state.dHasMore) {
    $('#stream').insertAdjacentHTML('afterbegin', '<button id="more">加载更早的消息</button>')
    $('#more').addEventListener('click', () => loadHistory(true))
  }
}

/* 人话视图：chunk/step/retry/compaction 等中间态一律折叠（实测占 98%+）；
 * 思维链对齐桌面端交互：折叠一行 + 点击展开全文。 */
function thinkingBlock(text) {
  const head = text.length > 60 ? '💭 …' + esc(text.slice(-60)) : '💭 ' + esc(text)
  return '<div class="msg thinking collapsed"><span class="th-head">' + head + '</span>' +
    '<div class="th-full">' + esc(text) + '</div></div>'
}
function eventToHtml(entry) {
  const event = entry.event ?? entry
  const view = entry.view
  const t = event.type
  const d = event.data ?? {}
  if (t === 'user/message') {
    const text = (d.content ?? []).filter((b) => b.type === 'text').map((b) => b.text).join('\n')
    return text ? '<div class="msg user">' + esc(text) + '</div>' : null
  }
  if (t === 'assistant/message') {
    // 思维链独立成可展开块；连续 text 合并为一个正文块；tool-call 一行灰字
    const out = []
    let texts = []
    const flush = () => { if (texts.length > 0) { out.push('<div class="msg assistant">' + texts.join('\n') + '</div>'); texts = [] } }
    for (const b of d.message?.content ?? []) {
      if (b.type === 'reasoning' && b.text) { flush(); out.push(thinkingBlock(b.text)) }
      else if (b.type === 'text' && b.text) texts.push(esc(b.text))
      else if (b.type === 'tool-call' && b.name) { flush(); out.push(toolLine(b.name, null)) }
    }
    flush()
    return out.length > 0 ? out.join('') : null
  }
  if (t === 'tool/call') {
    const title = view?.for === 'call' ? view.view.title : null
    return toolLine(d.name ?? '工具', title)
  }
  if (t === 'tool/result') {
    const title = view?.for === 'result' ? (view.view.title ?? '完成') : '完成'
    return toolLine(null, title)
  }
  return null
}
function toolLine(name, title) {
  return '<div class="msg tool">' + esc(title ?? ('🔧 ' + (name ?? ''))) + '</div>'
}
/* 实时直播区：reasoning 一行持续滚动显示最新内容（点击展开全文），
 * 正文打字机式呈现；正式 assistant/message 落地后清空，避免重复。 */
let liveThink = '', liveText = '', liveOpen = false
function renderLive(forceScroll) {
  const live = $('#live')
  if (liveThink === '' && liveText === '') { live.className = ''; live.innerHTML = ''; return }
  live.className = 'on'
  const tail = liveThink.length > 60 ? '…' + liveThink.slice(-60) : liveThink
  live.innerHTML =
    (liveThink !== ''
      ? '<div class="msg thinking' + (liveOpen ? '' : ' collapsed') + '" id="livethink">' +
        '<span class="th-head">💭 ' + esc(tail) + '</span>' +
        '<div class="th-full"></div></div>'
      : '') +
    (liveText !== '' ? '<div class="msg assistant" id="liveres"></div>' : '')
  if (liveThink !== '') $('#livethink .th-full').textContent = liveThink
  const res = $('#liveres')
  if (res) res.textContent = liveText
  const stream = $('#stream')
  if (forceScroll || stream.scrollHeight - stream.scrollTop - stream.clientHeight < 120) {
    stream.scrollTop = stream.scrollHeight
  }
}
function clearLive() { liveThink = ''; liveText = ''; liveOpen = false; renderLive(false) }

function onDetailEvent(frame) {
  if (!frame || typeof frame.sessionId !== 'string') return
  const event = frame.event ?? frame
  const t = event.type
  const here = frame.sessionId === state.detail
  // 非当前会话：仅当它有详情缓存时把实体事件追加进缓存（列表页期间
  // 新消息也进缓存，重进详情时秒开且不丢消息）
  if (!here) {
    const h = state.hist.get(frame.sessionId)
    if (!h) return
    const html = eventToHtml({ event, view: frame.view })
    if (html) { h.html += html; h.ts = Date.now() }
    return
  }
  // 流式 chunk：思维链与正文实时增量
  if (t === 'assistant/chunk') {
    const c = (event.data ?? {}).chunk
    if (!c) return
    if (c.type === 'reasoning-delta') { liveThink += c.text ?? ''; renderLive(false) }
    else if (c.type === 'text-delta') { liveText += c.text ?? ''; renderLive(false) }
    return
  }
  // 一条完整消息落库 → 直播区让位给正式渲染
  if (t === 'assistant/message') clearLive()
  // turn 边界：驱动 "Deep diving..." 状态行
  if (t === 'turn/start') { state.turnStart = event.time ?? Date.now(); renderTurn() }
  else if (t === 'turn/end' && state.turnStart !== null) { clearTurn() }
  const html = eventToHtml(frame)
  if (!html) return
  // 当前会话的实体事件同时进缓存（后台刷新/重进时保持连续）
  const h = state.hist.get(frame.sessionId)
  if (h) { h.html += html; h.ts = Date.now() }
  const stream = $('#stream')
  const atBottom = stream.scrollHeight - stream.scrollTop - stream.clientHeight < 80
  $('#live').insertAdjacentHTML('beforebegin', html)
  if (atBottom) stream.scrollTop = stream.scrollHeight
}

async function sendPrompt() {
  const input = $('#input')
  const text = input.value.trim()
  if (!text || !state.detail) return
  input.value = ''
  const sid = state.detail
  try {
    const r = await rpc('session.prompt', {
      sessionId: sid, mode: 'queue',
      content: [{ type: 'text', text }],
      ...(TZ ? { clientTimeZone: TZ } : {}),
    })
    if (!r.ok) { setBanner('发送失败：' + (r.error?.message ?? '?')); input.value = text }
  } catch (err) { setBanner('发送失败（' + err.message + '）'); input.value = text }
}

/* 详情页内的待处理问题卡（普通 question 在此逐题作答） */
function syncPendingToDetail() {
  if (state.detail) renderAskCard()
}
function renderAskCard() {
  const card = $('#askcard')
  if (!state.detail) { card.style.display = 'none'; return }
  const qs = [...state.pending.entries()].filter(([, p]) => p.sessionId === state.detail && p.kind === 'question')
  if (qs.length === 0) { card.style.display = 'none'; card.innerHTML = ''; return }
  card.style.display = 'block'
  let html = '<b style="color:var(--ques)">等待你的回答</b>'
  for (const [key, p] of qs) {
    ;(p.frame.questions ?? []).forEach((q, qi) => {
      html += '<div class="q">' + esc(q.header ? q.header + ' · ' : '') + esc(q.question) + '</div>'
      for (const o of q.options ?? []) {
        html += '<button class="opt" data-key="' + esc(key) + '" data-q="' + qi + '" data-label="' + esc(o.label) + '">' +
          esc(o.label) + (o.description ? '<br><small style="color:var(--dim)">' + esc(o.description) + '</small>' : '') + '</button>'
      }
    })
  }
  card.innerHTML = html
  card.querySelectorAll('.opt').forEach((el) => {
    el.addEventListener('click', async () => {
      const key = el.dataset.key
      const p = state.pending.get(key)
      if (!p) return
      const q = (p.frame.questions ?? [])[Number(el.dataset.q)]
      if (!q) return
      try {
        await respond(p.rpcId, { sessionId: p.frame.sessionId,
          answer: { answers: [{ id: q.id, selected: [el.dataset.label] }] } })
        state.pending.delete(key)
        renderAskCard()
        render()
      } catch (err) { setBanner('回答失败（' + err.message + '）') }
    })
  })
}

/* ---------- interactions ---------- */
document.querySelectorAll('.chip').forEach((c) => {
  c.addEventListener('click', () => { state.filter = c.dataset.f; render() })
})

// 列表点击代理：操作按钮 → 一键回答；分组头 → 收起/展开；行 → 详情
$('#list').addEventListener('click', (ev) => {
  const actBtn = ev.target.closest('.btn[data-act]')
  if (actBtn) {
    actBtn.disabled = true
    answer(actBtn.closest('.acts').dataset.key, actBtn.dataset.act)
    return
  }
  const group = ev.target.closest('.group[data-g]')
  if (group) {
    const g = group.dataset.g
    if (state.collapsed.has(g)) state.collapsed.delete(g)
    else state.collapsed.add(g)
    saveCollapsed()
    render()
    return
  }
  const row = ev.target.closest('.row[data-sid]')
  if (row) openDetail(row.dataset.sid)
})

// 新建会话：空 payload（全字段可选，契约允许），成功后直接进详情发第一句话
async function createSession() {
  try {
    const r = await rpc('session.create', {})
    if (!r.ok) { setBanner('创建失败：' + (r.error?.message ?? '?')); return }
    await resync()
    openDetail(r.value.sessionId)
  } catch (err) { setBanner('创建失败（' + err.message + '）') }
}
$('#plus').addEventListener('click', createSession)
$('#back').addEventListener('click', closeDetail)
$('#send').addEventListener('click', sendPrompt)
$('#input').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') sendPrompt() })
$('#modelrow').addEventListener('click', openSheet)
$('#sheetmask').addEventListener('click', (ev) => { if (ev.target.id === 'sheetmask') closeSheet() })

// 思维链块点击展开/折叠（历史块与直播块通用）；直播块记住展开状态，
// 避免下一条 delta 重绘时被折回去
$('#stream').addEventListener('click', (ev) => {
  const head = ev.target.closest('.th-head')
  if (!head) return
  const block = head.closest('.msg.thinking')
  block.classList.toggle('collapsed')
  if (block.id === 'livethink') liveOpen = !block.classList.contains('collapsed')
})

// 下拉刷新
let touchStartY = 0, pulling = false
const pull = $('#pull')
document.addEventListener('touchstart', (ev) => {
  if (window.scrollY <= 0) { touchStartY = ev.touches[0].clientY; pulling = true }
}, { passive: true })
document.addEventListener('touchmove', (ev) => {
  if (!pulling) return
  pull.classList.toggle('armed', ev.touches[0].clientY - touchStartY > 28)
}, { passive: true })
document.addEventListener('touchend', () => {
  if (pulling && pull.classList.contains('armed')) resync()
  pulling = false; pull.classList.remove('armed')
})

// 回前台立即对齐
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    resync(); loadHostInfo()
    if (state.detail) loadHistory(false)
  }
})

/* ---------- boot ----------
 * 高延迟链路（DERP 中继 ~400ms RTT）下一切串行都是成本：
 * 数据同步、宿主信息、两条 WS 同时发起，最慢的那路决定首屏。
 * host WS onopen 内的 resync/loadHostInfo 覆盖重连场景；syncing 锁去重。 */
openHostStream()
openMuxStream()
resync()
loadHostInfo()
// notify 深链：/m?s=<sessionId> 直达会话
const deepSid = new URLSearchParams(location.search).get('s')
if (deepSid) openDetail(deepSid)
</script>
</body>
</html>
